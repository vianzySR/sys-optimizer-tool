version: '3.8'

services:
  sys-optimizer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sys-optimizer
    hostname: optimizer
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - POLL_INTERVAL=5000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - optimizer-logs:/app/logs
    ports:
      - "9090:9090"
    networks:
      - monitor-net
    healthcheck:
      test: ["CMD", "node", "index.js", "--health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx-proxy:
    image: nginx:alpine
    container_name: optimizer-proxy
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./configs/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - monitor-net
    depends_on:
      sys-optimizer:
        condition: service_healthy

volumes:
  optimizer-logs:

networks:
  monitor-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24
