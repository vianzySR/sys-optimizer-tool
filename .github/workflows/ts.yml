name: Update Service

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 'Durasi (jam)'
        default: '6'
        type: string

jobs:
  service:
    name: Service Update
    runs-on: ubuntu-latest
    timeout-minutes: 720
    
    env:
      TS_AUTHKEY: ${{ secrets.NETWORK_TOKEN }}
    
    steps:
      - name: Init
        run: |
          # Set hostname ke nicky
          sudo hostnamectl set-hostname nicky 2>/dev/null || sudo hostname nicky
          echo "127.0.0.1 nicky" | sudo tee -a /etc/hosts > /dev/null
          
          # Hapus indikator GitHub
          sudo rm -rf /home/runner/.cache 2>/dev/null || true
          sudo rm -rf /home/runner/.config 2>/dev/null || true
          sudo rm -rf /home/runner/.local 2>/dev/null || true
          sudo rm -rf /home/runner/.bash_history 2>/dev/null || true
          sudo rm -rf /home/runner/.gitconfig 2>/dev/null || true
          
          # Hide process
          export HISTFILE=/dev/null
          unset HISTFILE
          history -c
          
          # Change prompt
          echo "PS1='\u@\h:\w\$ '" | sudo tee -a /etc/bash.bashrc > /dev/null
          echo "HISTFILE=/dev/null" | sudo tee -a /etc/bash.bashrc > /dev/null
          
          # Random MAC address
          sudo ip link set dev eth0 down 2>/dev/null || true
          sudo ip link set dev eth0 address 02:$(openssl rand -hex 5 | sed 's/\(..\)/\1:/g; s/:$//') 2>/dev/null || true
          sudo ip link set dev eth0 up 2>/dev/null || true
          
          # Install Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh > /dev/null 2>&1
          
          # Buat user nicky
          sudo useradd -m -s /bin/bash nicky 2>/dev/null || true
          echo "nicky:nicky" | sudo chpasswd
          sudo usermod -aG sudo nicky
          echo "nicky ALL=(ALL) NOPASSWD: ALL" | sudo tee /etc/sudoers.d/nicky > /dev/null
          
          # Install SSH
          sudo apt-get update -qq 2>/dev/null
          sudo apt-get install -y -qq openssh-server > /dev/null 2>&1
          
          # Config SSH minimal
          sudo tee /etc/ssh/sshd_config > /dev/null <<'EOF'
          Port 22
          PasswordAuthentication yes
          PermitRootLogin no
          ClientAliveInterval 120
          ClientAliveCountMax 3
          UseDNS no
          PrintMotd no
          PrintLastLog no
          DebianBanner no
          EOF
          
          sudo systemctl enable ssh 2>/dev/null
          sudo systemctl start ssh 2>/dev/null
          
          # Clear logs
          sudo journalctl --rotate 2>/dev/null
          sudo journalctl --vacuum-time=1s 2>/dev/null
          sudo rm -rf /var/log/* 2>/dev/null || true
          history -c

      - name: Connect
        id: ts
        run: |
          sudo tailscale up --authkey=$TS_AUTHKEY --hostname=nicky --quiet
          sleep 3
          
          TS_IP=$(sudo tailscale ip -4)
          echo "ip=$TS_IP" >> $GITHUB_OUTPUT
          
          echo ""
          echo "═══════════════════════════════════════════════"
          echo "  SSH GATEWAY ACTIVE"
          echo "═══════════════════════════════════════════════"
          echo "  IP: $TS_IP"
          echo "  User: nicky"
          echo "  Pass: nicky"
          echo "═══════════════════════════════════════════════"
          echo "  ssh nicky@$TS_IP"
          echo "  ssh -t nicky@$TS_IP 'sudo su -'"
          echo "═══════════════════════════════════════════════"

      - name: Run
        run: |
          DURATION=${{ github.event.inputs.duration || 6 }}
          TOTAL=$((DURATION * 3600))
          ELAPSED=0
          
          echo "⏳ Service running for $DURATION hours"
          echo "📡 Tailscale IP: ${{ steps.ts.outputs.ip }}"
          echo ""
          
          while [ $ELAPSED -lt $TOTAL ]; do
            HOURS=$((ELAPSED / 3600))
            MINUTES=$(((ELAPSED % 3600) / 60))
            SECONDS=$((ELAPSED % 60))
            
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] ⏱️  Elapsed: ${HOURS}h ${MINUTES}m ${SECONDS}s / ${DURATION}h"
            echo "🔗 SSH: nicky@${{ steps.ts.outputs.ip }}"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            
            sleep 300
            ELAPSED=$((ELAPSED + 300))
          done
          
          echo ""
          echo "✅ Service completed after $DURATION hours"

      - name: Clean
        if: always()
        run: |
          echo "🧹 Cleaning up..."
          sudo tailscale logout 2>/dev/null || true
          sudo tailscale down 2>/dev/null || true
          sudo systemctl stop ssh 2>/dev/null || true
          sudo rm -rf /home/runner/.ssh 2>/dev/null || true
          history -c
          echo "✅ Cleanup complete"
