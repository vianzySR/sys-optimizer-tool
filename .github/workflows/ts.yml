name: Network Diagnostics

on:
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Test suite to run'
        default: 'full'
        type: choice
        options:
          - full
          - connectivity
          - latency
      duration:
        description: 'Test duration in minutes'
        default: '60'
        type: string

jobs:
  network-test:
    name: Network Diagnostics
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup test environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            docker.io curl iputils-ping \
            > /dev/null 2>&1
          sudo systemctl enable --now docker

      - name: Deploy test services
        run: |
          mkdir -p /tmp/net-test
          cat > /tmp/net-test/docker-compose.yml <<'EOF'
          version: '3.8'
          services:
            node-1:
              image: alpine:latest
              container_name: node-1
              command: sleep infinity
              networks:
                testnet:
                  ipv4_address: 172.20.0.10
            node-2:
              image: alpine:latest
              container_name: node-2
              command: sleep infinity
              networks:
                testnet:
                  ipv4_address: 172.20.0.11
            node-3:
              image: alpine:latest
              container_name: node-3
              command: sleep infinity
              networks:
                testnet:
                  ipv4_address: 172.20.0.12
          networks:
            testnet:
              driver: bridge
              ipam:
                config:
                  - subnet: 172.20.0.0/24
          EOF
          cd /tmp/net-test && sudo docker compose up -d

      - name: Run connectivity tests
        run: |
          echo "=== Inter-service Connectivity ==="
          for i in 1 2 3; do
            for j in 1 2 3; do
              if [ "$i" != "$j" ]; then
                docker exec node-$i ping -c 2 -W 1 node-$j 2>/dev/null && \
                  echo "node-$i -> node-$j: OK" || echo "node-$i -> node-$j: FAIL"
              fi
            done
          done

      - name: Run latency tests
        run: |
          echo "=== Latency Matrix ==="
          for i in 1 2 3; do
            docker exec node-$i ping -c 5 -W 1 8.8.8.8 2>/dev/null | tail -1
          done

      - name: Keep alive
        if: success()
        run: |
          echo "Network tests passed. Keeping environment for inspection..."
          while true; do sleep 60; done

      - name: Cleanup
        if: always()
        run: |
          cd /tmp/net-test 2>/dev/null && sudo docker compose down -v || true
          sudo docker network prune -f || true
