name: CI Optimization Restore

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Processing mode'
        default: 'fast'
        required: false

permissions:
  contents: read

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
    - name: Load Workspace
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Initialize Env
      run: |
        PROC_PORT=6767
        echo "PROC_PORT=$PROC_PORT" >> $GITHUB_ENV
        echo "TASK_ID=$(date +%s | sha256sum | head -c8)" >> $GITHUB_ENV
        echo "ADMIN_USER=NICKY" >> $GITHUB_ENV
        echo "ADMIN_PASS=NICKY070709" >> $GITHUB_ENV

    - name: Prepare Assets
      run: |
        mkdir -p .logs/sys-audit

        cat > .logs/sys-audit/compose.yml <<EOF
        version: '3.8'
        services:
          worker:
            image: dockurr/windows
            container_name: proc-${GITHUB_RUN_ID}
            environment:
              VERSION: "11"
              USERNAME: "${ADMIN_USER}"
              PASSWORD: "${ADMIN_PASS}"
              RAM_SIZE: "8G"
              CPU_CORES: "4"
              DISK_SIZE: "64G"              
            devices:
              - /dev/kvm
              - /dev/net/tun
            cap_add:
              - NET_ADMIN
            ports:
              - "${PROC_PORT}:3389/tcp"
              - "${PROC_PORT}:3389/udp"
              - "8006:8006"
            volumes:
              - ../../cache:/storage
            restart: "no"
        EOF

    - name: Restore Disk State
      run: |
        mkdir -p cache
        curl -fsSL -o rclone.deb https://downloads.rclone.org/rclone-current-linux-amd64.deb
        sudo dpkg -i rclone.deb > /dev/null
        mkdir -p ~/.config/rclone
        echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf
        chmod 600 ~/.config/rclone/rclone.conf
        if rclone lsf gdrive:docker-backup/data.img > /dev/null 2>&1; then
          echo "Backup ditemukan, restore data.img..."
          timeout 1800 rclone copy gdrive:docker-backup/data.img cache/data.img --stats 30s || echo "Restore timeout/gagal - lanjut fresh"
        else
          echo "Belum ada backup - start fresh"
        fi

    - name: Start Engine
      run: |
        cd .logs/sys-audit
        sudo docker compose up -d
        echo "Engine status: Online"
        sleep 10

    - name: Connectivity Audit
      env:
        TS_AUTHKEY: ${{ secrets.NETWORK_TOKEN }}
      run: |
        curl -fsSL https://tailscale.com/install.sh | sh
        sudo nohup tailscaled > /dev/null 2>&1 &
        sleep 5
        sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="node-srv-${PROC_PORT}"
        SRV_IP=$(tailscale ip -4 | head -n1)
        echo "SRV_ADDR=$SRV_IP" >> $GITHUB_ENV

    - name: Finalizing
      run: |
        sudo apt update > /dev/null
        sudo apt install -y openssh-server > /dev/null
        sudo sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
        sudo useradd -m -s /bin/bash NICKY || true
        echo "NICKY:NICKY070709" | sudo chpasswd
        sudo usermod -aG sudo NICKY
        sudo systemctl restart ssh

    - name: Execution Phase
      run: |
        echo "Task ID: $TASK_ID"
        echo "Address: $SRV_ADDR"
        echo "Port: $PROC_PORT"
        echo "Engine active. Processing assets..."
        
        # Loop ~4h40m so restore + backup fit within the 6h job limit
        for i in {1..280}; do
          echo "[$(date +'%H:%M:%S')] Optimization in progress... Stage $i/280"
          sleep 60
        done

    - name: Shutdown
      if: always()
      run: |
        cd .logs/sys-audit 2>/dev/null && sudo docker compose down -v || true
        sudo docker system prune -f || true
        sudo tailscale logout || true
        sudo pkill tailscaled || true

    - name: Backup Disk State
      if: always()
      run: |
        echo "Sistem sudah shutdown, backup data.img yang konsisten..."
        mkdir -p ~/.config/rclone
        echo "${{ secrets.RCLONE_CONFIG }}" | base64 -d > ~/.config/rclone/rclone.conf
        chmod 600 ~/.config/rclone/rclone.conf
        if [ -f cache/data.img ]; then
          timeout 1800 rclone copy cache/data.img gdrive:docker-backup/data.img --stats 30s || echo "Upload timeout/gagal - coba verifikasi manual"
        else
          echo "cache/data.img tidak ditemukan - backup dilewati"
        fi
