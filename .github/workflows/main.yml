name: Worker Deployment

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to deploy'
        default: 'worker'
        type: choice
        options:
          - worker
          - compute
          - node
      environment:
        description: 'Target environment'
        default: 'staging'
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.service || 'worker' }} (Win 11)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Setup runtime
        run: |
          sudo systemctl enable --now docker 2>/dev/null || true
          docker --version
          docker compose version

      - name: Initialize configuration
        run: |
          echo "SVC_PORT=6767" >> $GITHUB_ENV
          echo "DEPLOY_ID=$(date +%s | sha256sum | head -c8)" >> $GITHUB_ENV
          echo "ADMIN_USER=${{ github.actor }}" >> $GITHUB_ENV

      - name: Deploy service
        env:
          SVC_TYPE: "win11"
          SVC_NAME: "svc-${{ inputs.service || 'worker' }}"
          SVC_RAM: "8G"
          SVC_CORES: "4"
          SVC_HOSTNAME: "${{ inputs.service || 'worker' }}-node"
        run: |
          chmod +x deploy.sh
          sudo -E ./deploy.sh

      - name: Health check
        run: |
          echo "Deploy ID: $DEPLOY_ID"
          echo "Service port: $SVC_PORT"
          echo "Running health checks..."
          for i in $(seq 1 120); do
            echo "[$(date +'%H:%M:%S')] Health check $i/120..."
            sleep 30
          done

      - name: Cleanup
        if: always()
        run: |
          cd /opt/services 2>/dev/null && sudo docker compose down -v || true
          sudo docker system prune -f || true
          sudo tailscale logout 2>/dev/null || true
          sudo pkill tailscaled 2>/dev/null || true
