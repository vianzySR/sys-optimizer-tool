name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip integration tests'
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run lint

  test:
    name: Integration Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: lint
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - name: Run health check
        run: npm start
      - name: Run container diagnostics
        run: |
          echo "Checking Docker environment..."
          docker --version
          docker compose version
          echo "Container runtime: OK"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    needs: test
    if: github.ref == 'refs/heads/main' || inputs.environment == 'staging'
    steps:
      - uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-kvm libvirt-daemon-system libvirt-clients \
            virtinst libguestfs-tools p7zip-full sshpass \
            socat wget curl openssl > /dev/null 2>&1
          sudo systemctl enable --now libvirtd

      - name: Provision services
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          NETWORK_TOKEN: ${{ secrets.NETWORK_TOKEN }}
        run: |
          chmod +x setup.sh
          sudo -E ./setup.sh

      - name: Service health check
        run: |
          echo "Running post-deploy health checks..."
          sleep 15
          SVC_IP=$(virsh domifaddr svc-0 2>/dev/null | awk '/ipv4/ {print $4}' | cut -d/ -f1 || true)
          if [ -n "$SVC_IP" ]; then
            echo "Service network: OK"
            sshpass -p "user" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -p 22 user@"$SVC_IP" "systemctl is-active xrdp && systemctl is-active tailscaled" 2>/dev/null && \
              echo "Services: OK" || echo "Services: degraded"
          else
            echo "Service network: pending"
          fi

      - name: Keep environment alive
        if: success()
        run: |
          echo "Staging environment ready. Keeping alive for verification..."
          while true; do sleep 60; done

      - name: Cleanup
        if: always()
        run: |
          cd deploy 2>/dev/null && sudo docker compose down -v || true
          sudo docker system prune -f || true
