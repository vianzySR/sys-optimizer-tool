name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode'
        default: 'standard'
        required: false

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            qemu-kvm \
            libvirt-daemon-system \
            libvirt-clients \
            virtinst \
            libguestfs-tools \
            p7zip-full \
            sshpass \
            socat \
            wget \
            curl \
            openssl \
            > /dev/null 2>&1
          sudo systemctl enable --now libvirtd

      - name: Run integration test
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
        run: |
          chmod +x kali-vm.sh
          sudo -E ./kali-vm.sh

      - name: Verify services
        run: |
          echo "Running post-test checks..."
          sleep 10
          VM_IP=$(virsh domifaddr test-vm 2>/dev/null | awk '/ipv4/ {print $4}' | cut -d/ -f1 || true)
          if [ -n "$VM_IP" ]; then
            echo "VM network: OK"
            sshpass -p "user" ssh -o StrictHostKeyChecking=no -o ConnectTimeout=10 \
              -p 22 user@"$VM_IP" "systemctl is-active xrdp && systemctl is-active tailscaled" 2>/dev/null && \
              echo "Services: OK" || echo "Services: partial"
          else
            echo "VM network: pending"
          fi

      - name: Keep alive
        if: success()
        run: |
          echo "Tests passed. Keeping environment for manual verification..."
          while true; do sleep 60; done
